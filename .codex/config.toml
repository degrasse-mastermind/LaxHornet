# Project-scoped Codex configuration for LaxHornet.
# Codex loads this file only after the repository is trusted.
#
# Do not pin `model` here. ChatGPT-authenticated Codex accounts can have
# different model availability based on plan, rollout, client version, and
# workspace controls. Let Codex select the newest supported model for the
# signed-in account, then verify it with `/model`.
#
# MCP servers are intentionally not declared here. In the current Windows
# desktop session, project-level MCP declarations were visible in configuration
# but were not instantiated as runtime tools. Runtime MCP connections must be
# configured in the user's `~/.codex/config.toml`, then validated with `/mcp`.
# Repository policy in AGENTS.md still governs which server may be used.

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
