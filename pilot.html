n></nav></main><div id="toast" class="toast"></div><script>const K='lh_vnext_pilot_1',D={player:'Wes',jersey:'22',team:'Branford'},E=['Goal','Assist','Shot on Goal','Missed Shot','Ground Ball','Caused Turnover','Turnover','Faceoff Win','Faceoff Loss','Successful Clear','Failed Clear','Defensive Stop','Backed Up Shot','Save','Goal Allowed','Penalty','Hustle Play','Smart Play'];let db=load(),cur='home',timer=null,mode='snapshot';function blank(){return{profile:{...D},games:[],active:null,review:null}}function load(){try{return JSON.parse(localStorage.getItem(K))||blank()}catch{return blank()}}function save(){localStorage.setItem(K,JSON.stringify(db))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}function q(x){return document.querySelector(x)}function esc(x=''){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function mm(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function clock(g){return g.run?Math.max(0,g.clock-Math.floor((Date.now()-g.started)/1000)):g.clock}function tracked(g){return(g.tracked||0)+(g.on?Math.max(0,Math.floor((Date.now()-g.shift)/1000)):0)}function toast(x){let t=q('#toast');t.textContent=x;t.classList.add('on');clearTimeout(t.t);t.t=setTimeout(()=>t.classList.remove('on'),1500)}function go(x){if(x==='track'&&!db.active)x='start';cur=x;document.querySelectorAll('.s').forEach(s=>s.classList.toggle('on',s.id===x));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.nav===x||(x==='start'&&n.dataset.nav==='track')||(x==='review'&&n.dataset.nav==='games')));render();scrollTo(0,0);history.replaceState(null,'','#'+x)}function stopClock(g){if(g.run){g.clock=clock(g);g.run=false;g.started=null}}function stopShift(g){if(g.on){let now=Date.now(),d=Math.max(0,Math.floor((now-g.shift)/1000));g.tracked=(g.tracked||0)+d;(g.shifts??=[]).push({id:id(),p:g.p,start:g.shift,end:now,d});g.on=false;g.shift=null}}function render(){clearInterval(timer);({home:rHome,start:rStart,track:rTrack,games:rGames,review:rReview,season:rSeason,more:rMore}[cur]||rHome)();if(cur==='track'&&db.active)timer=setInterval(()=>{let g=db.active;if(!g)return;let c=q('#clk'),t=q('#trk');if(c)c.textContent=mm(clock(g));if(t)t.textContent=mm(tracked(g))+' tracked'},500)}function rHome(){let g=db.active,r=db.games[0];q('#home').innerHTML=`<div class=home><div class=eye>Private local-first pilot</div><h1>Track the game.<br>Keep the story.</h1><p>Fast sideline capture with evidence-first review after the final whistle.</p>${g?`<button class="btn primary full" data-go=track>Resume ${esc(g.team)} vs ${esc(g.opp)}</button>`:`<button class="btn primary full" data-go=start>Track a Game</button>`}</div>${r?`<div class=eye style="margin-top:28px">Latest game</div><div class=game data-review="${r.id}"><div class=row><div class=teams>${esc(r.team)} ${r.for} — ${r.against} ${esc(r.opp)}</div><b>${r.for>r.against?'W':r.for<r.against?'L':'T'}</b></div><div class=muted>${r.date} · ${esc(r.player)} · ${mm(r.tracked)} tracked</div></div>`:''}<div class=card><div class=trust><span class=pill>On-device</span><span class=pill>Offline-capable</span><span class=pill>No cloud writes</span></div></div>`}function rStart(){let p=db.profile,t=new Date().toISOString().slice(0,10);q('#start').innerHTML=`<div class=eye>New game</div><h1>Set the game.</h1><p class=sub>Choose game structure before entering Live mode.</p><form id=f class=form><label>Player</label><input class=input name=player value="${esc(p.player)}" required><label>Jersey</label><input class=input name=jersey value="${esc(p.jersey)}"><label>Team</label><input class=input name=team value="${esc(p.team)}" required><label>Opponent</label><input class=input name=opp placeholder=Westport required><label>Date</label><input class=input type=date name=date value="${t}" required><label>Format</label><select class=input name=format><option value=quarters>Quarters</option><option value=halves>Halves</option></select><label>Period length</label><select class=input name=minutes><option value=10>10 minutes</option><option value=12 selected>12 minutes</option><option value=15>15 minutes</option><option value=20>20 minutes</option><option value=25>25 minutes</option></select><div class=helper>This sets the clock length for every quarter or half. You can still move periods manually during the game.</div><button class="btn primary full" style="margin-top:18px">Start Game</button></form>`}function rTrack(){let g=db.active;if(!g)return go('start');q('#track').innerHTML=`<div class=eye>Live game · ${g.max===2?g.max+' halves':g.max+' quarters'} · ${Math.round(g.periodSec/60)} min each</div><div class=score><div><div class=muted>${esc(g.team)}</div><div class=big>${g.for}</div><div class=controls><button data-score="for:-1">−</button><button data-score="for:1">+</button></div></div><div class=center><div class=muted>${g.max===2?'H':'Q'}${g.p}</div><div class=clock id=clk>${mm(clock(g))}</div><button class="btn small" id=clock>${g.run?'Pause':'Run'}</button></div><div class=away><div class=muted>${esc(g.opp)}</div><div class=big>${g.against}</div><div class=controls><button data-score="against:-1">−</button><button data-score="against:1">+</button></div></div></div><div class=card><div class=row><div><div class=muted>TRACKING</div><b>${esc(g.player)}${g.jersey?' · #'+esc(g.jersey):''}</b><div class=muted id=trk>${mm(tracked(g))} tracked</div></div><button id=field class="field ${g.on?'':'out'}">${g.on?'SUB OUT':'PUT IN'}</button></div><div class="fieldstate ${g.on?'on':'off'}">${g.on?'● ON FIELD — EVENTS ENABLED':'○ OFF FIELD — EVENT BUTTONS LOCKED'}</div></div><div class=row style="margin:16px 0 10px"><div class=eye style="margin:0">Quick events</div><button class="btn small" id=next>Next ${g.max===2?'Half':'Quarter'}</button></div><div class=events>${E.map((x,i)=>`<button class="event ${i===0?'goal':''}" data-event="${x}" ${g.on?'':'disabled'}>${x}</button>`).join('')}</div><div class=card style="margin-top:12px"><div class=muted>LAST RECORDED</div><div class=row><b>${g.events[0]?esc(g.events[0].type)+' · '+mm(g.events[0].clock):'No events yet'}</b><button class="btn small" id=undo ${g.events.length?'':'disabled'}>Undo</button></div></div><button class="btn primary full" id=end>End Game</button>`}function rGames(){q('#games').innerHTML=`<div class=eye>Your game history</div><h1>Games</h1><p class=sub>Open a game for Snapshot, Story, and Evidence.</p>${db.games.length?`<div class=list>${db.games.map(g=>`<div class=game data-review="${g.id}"><div class=row><div class=teams>${esc(g.team)} ${g.for} — ${g.against} ${esc(g.opp)}</div><b>${g.for>g.against?'W':g.for<g.against?'L':'T'}</b></div><div class=muted>${g.date} · ${esc(g.player)} · ${mm(g.tracked)} · ${g.events.length} events</div></div>`).join('')}</div>`:`<div class=empty>No saved games yet.</div>`}`}function reviewGame(){return db.games.find(g=>g.id===db.review)||db.games[0]}function counts(g){let o={};g.events.forEach(e=>o[e.type]=(o[e.type]||0)+1);return o}function rReview(){let g=reviewGame();if(!g){q('#review').innerHTML='<div class=empty>No game to review.</div>';return}let c=counts(g),body='';if(mode==='snapshot')body=`<div class=score><div><div class=muted>${esc(g.team)}</div><div class=big>${g.for}</div></div><div class=center><div class=muted>Final</div></div><div class=away><div class=muted>${esc(g.opp)}</div><div class=big>${g.against}</div></div></div><div class=card><div class=row><b>${esc(g.player)}</b><b>${mm(g.tracked)}</b></div><div class=trust style="margin-top:10px"><span class=pill>Record complete</span><span class=pill>Saved on device</span></div></div><div class=card><div class=contrib><div><b>${c['Goal']||0}</b><span>Goals</span></div><div><b>${c['Assist']||0}</b><span>Assists</span></div><div><b>${c['Ground Ball']||0}</b><span>Ground Balls</span></div><div><b>${c['Caused Turnover']||0}</b><span>CTOs</span></div></div><div class=muted style="margin-top:10px">${g.events.length} events · ${(g.shifts||[]).length} shifts · ${mm(g.tracked)} tracked</div></div>`;else if(mode==='story'){let early=g.events.filter(e=>e.p<=Math.ceil(g.max/2)).length,late=g.events.length-early;body=`<p class=sub>No verdict. This organizes the recorded sequence only.</p><div class=card>${[...Array(g.max)].map((_,i)=>{let es=[...g.events].reverse().filter(e=>e.p===i+1);return`<div style="padding:9px 0;border-bottom:1px solid #fff1"><b>${g.max===2?'H':'Q'}${i+1}</b><div class=muted>${es.length?es.map(e=>esc(e.type)).join(' · '):'No recorded events'}</div></div>`}).join('')}</div><div class=card><b>Pattern in the record</b><p class=sub style="margin:8px 0 0">${!g.events.length?'Not enough evidence for a pattern.':late>early?'More recorded events occurred later in the game.':early>late?'More recorded events occurred earlier in the game.':'Recorded involvement was distributed relatively evenly.'}</p></div>`}else body=`<p class=sub>The factual layer underneath the review.</p><div class=list>${g.events.length?g.events.map(e=>`<div class=game><div class=row><b>${g.max===2?'H':'Q'}${e.p} ${mm(e.clock)} · ${esc(e.type)}</b><span class=muted>${e.for}–${e.against}</span></div><div class=muted>${e.on?'On field':'Legacy off-field event'}</div></div>`).join(''):'<div class=empty>No events.</div>'}</div><div class=card style="margin-top:12px"><div class=muted>The record cannot show positioning, assignment, intent, matchup, or off-ball decisions that were not captured.</div></div>`;q('#review').innerHTML=`<div class=eye>${g.date} · ${esc(g.opp)}</div><h1>Game Review</h1><div class=tabs><button data-mode=snapshot class="${mode==='snapshot'?'on':''}">Snapshot</button><button data-mode=story class="${mode==='story'?'on':''}">Story</button><button data-mode=evidence class="${mode==='evidence'?'on':''}">Evidence</button></div>${body}`}function rSeason(){let t={};db.games.forEach(g=>g.events.forEach(e=>t[e.type]=(t[e.type]||0)+1));q('#season').innerHTML=`<div class=eye>Saved-game evidence</div><h1>Season</h1><p class=sub>Totals from this device only.</p><div class=card>${[['Games',db.games.length],['Tracked',mm(db.games.reduce((a,g)=>a+(g.tracked||0),0))],['Goals',t['Goal']||0],['Assists',t['Assist']||0],['Ground balls',t['Ground Ball']||0],['Caused turnovers',t['Caused Turnover']||0],['Faceoff wins',t['Faceoff Win']||0],['Saves',t['Save']||0]].map(x=>`<div class=row style="padding:10px 0;border-bottom:1px solid #fff1"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function rMore(){let p=db.profile;q('#more').innerHTML=`<div class=eye>Pilot settings</div><h1>More</h1><p class=sub>Defaults for faster game starts.</p><form id=pf class="form card"><label>Player</label><input class=input name=player value="${esc(p.player)}"><label>Jersey</label><input class=input name=jersey value="${esc(p.jersey)}"><label>Team</label><input class=input name=team value="${esc(p.team)}"><button class="btn primary full" style="margin-top:14px">Save defaults</button></form><div class=card><b>Data boundary</b><p class=sub style="margin:8px 0 0">This pilot stores game data only in this browser on this device. Clearing site data will erase it. Cloud sync is intentionally off.</p></div>`}document.addEventListener('click',e=>{let x=e.target.closest('[data-go]');if(x)return go(x.dataset.go);x=e.target.closest('[data-nav]');if(x)return go(x.dataset.nav);x=e.target.closest('[data-review]');if(x){db.review=x.dataset.review;save();mode='snapshot';return go('review')}x=e.target.closest('[data-mode]');if(x){mode=x.dataset.mode;return rReview()}x=e.target.closest('[data-score]');if(x&&db.active){let[a,d]=x.dataset.score.split(':');db.active[a]=Math.max(0,db.active[a]+Number(d));save();return rTrack()}x=e.target.closest('[data-event]');if(x&&db.active){let g=db.active;if(!g.on){toast('Player is OFF FIELD — tap PUT IN first');return}if(x.dataset.event==='Goal')g.for++;g.events.unshift({id:id(),type:x.dataset.event,p:g.p,clock:clock(g),at:Date.now(),for:g.for,against:g.against,on:true});save();rTrack();return toast(x.dataset.event+' recorded')}if(e.target.id==='clock'&&db.active){let g=db.active;if(g.run)stopClock(g);else{g.run=true;g.started=Date.now()}save();rTrack()}if(e.target.id==='field'&&db.active){let g=db.active;if(g.on){stopShift(g);toast('Player is OFF FIELD')}else{g.on=true;g.shift=Date.now();toast('Player is ON FIELD')}save();rTrack()}if(e.target.id==='next'&&db.active){let g=db.active;stopClock(g);stopShift(g);if(g.p<g.max){g.p++;g.clock=g.periodSec;save();rTrack();toast('Period '+g.p)}}if(e.target.id==='undo'&&db.active&&db.active.events.length){let ev=db.active.events.shift();if(ev.type==='Goal')db.active.for=Math.max(0,db.active.for-1);save();rTrack();toast('Event undone')}if(e.target.id==='end'&&db.active){let g=db.active;stopClock(g);stopShift(g);g.tracked=tracked(g);g.status='complete';g.ended=Date.now();db.games=[g,...db.games.filter(x=>x.id!==g.id)];db.review=g.id;db.active=null;save();mode='snapshot';go('review');toast('Game saved')}});document.addEventListener('submit',e=>{if(e.target.id==='f'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),max=d.format==='halves'?2:4,sec=Math.max(60,Number(d.minutes||12)*60);db.profile={player:d.player,jersey:d.jersey,team:d.team};db.active={id:id(),player:d.player,jersey:d.jersey,team:d.team,opp:d.opp,date:d.date,max,p:1,periodSec:sec,clock:sec,run:false,started:null,for:0,against:0,on:false,shift:null,tracked:0,shifts:[],events:[],status:'active'};save();go('track')}if(e.target.id==='pf'){e.preventDefault();db.profile=Object.fromEntries(new FormData(e.target).entries());save();toast('Defaults saved')}});window.addEventListener('beforeunload',()=>{if(db.active){stopClock(db.active);stopShift(db.active);save()}});go(location.hash.slice(1)||'home');</script></body></html>
