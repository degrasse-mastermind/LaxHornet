name: Allowlisted GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_ref:
        description: Exact reviewed main commit authorized for deployment
        required: true
        type: string
      authorized_source_sha:
        description: Full reviewed SHA authorized for deployment
        required: true
        type: string
      expected_runtime_marker:
        description: Expected live runtime marker after deployment
        required: true
        type: string
      expected_cache_marker:
        description: Expected live service-worker cache marker after deployment
        required: true
        type: string
      deployment_authorized:
        description: Confirm separate production deployment authorization exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: laxhornet-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build allowlisted Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      production_source_sha: ${{ steps.source.outputs.production_source_sha }}
      release_marker: ${{ steps.source.outputs.release_marker }}
      cache_marker: ${{ steps.source.outputs.cache_marker }}
      deployment_required: ${{ steps.source.outputs.deployment_required }}

    steps:
      - name: Check out exact deployment source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_ref || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify source identity and deployment authorization
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          release_marker="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          cache_marker="$(node -e "const source=require('fs').readFileSync('service-worker.js','utf8'); const match=source.match(/const CACHE_NAME = \"([^\"]+)\"/); if(!match) process.exit(1); process.stdout.write(match[1]);")"
          production_source_sha="$(node -p "JSON.parse(require('fs').readFileSync('release/laxhornet-release-manifest.json', 'utf8')).productionApplicationSha")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          if [[ "${{ github.event_name }}" == "push" && "$source_sha" != "$GITHUB_SHA" ]]; then
            echo "Push deployment source differs from the triggering commit." >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.deployment_authorized }}" == "true" ]] || { echo "DEPLOYMENT_AUTHORIZATION_REQUIRED: explicit confirmation is false." >&2; exit 1; }
            [[ "${{ inputs.authorized_source_sha }}" == "$source_sha" ]] || { echo "AUTHORIZED_SOURCE_SHA_MISMATCH: reviewed SHA does not match checkout." >&2; exit 1; }
            [[ "${{ inputs.expected_runtime_marker }}" == "$release_marker" ]] || { echo "EXPECTED_RUNTIME_MARKER_MISMATCH: authorization does not match version.json." >&2; exit 1; }
            [[ "${{ inputs.expected_cache_marker }}" == "$cache_marker" ]] || { echo "EXPECTED_CACHE_MARKER_MISMATCH: authorization does not match service-worker.js." >&2; exit 1; }
            deployment_required=true
            production_source_sha="$source_sha"
          else
            live_marker="$(node -e "fetch('https://laxhornet.mybranford.com/version.json?pages-preflight=' + Date.now(), {cache:'no-store'}).then(async response => { if(!response.ok) throw new Error(String(response.status)); process.stdout.write((await response.json()).version); })")"
            [[ "$live_marker" == "$release_marker" ]] || { echo "AUTOMATIC_DEPLOYMENT_NOT_AUTHORIZED: production differs from the repository; use an explicitly authorized workflow dispatch." >&2; exit 1; }
            deployment_required=false
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "production_source_sha=$production_source_sha" >> "$GITHUB_OUTPUT"
          echo "release_marker=$release_marker" >> "$GITHUB_OUTPUT"
          echo "cache_marker=$cache_marker" >> "$GITHUB_OUTPUT"
          echo "deployment_required=$deployment_required" >> "$GITHUB_OUTPUT"
          echo "Validated source commit: $source_sha"
          echo "Deployment required: $deployment_required"

      - name: Verify Pages source and custom-domain gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify_pages_settings.mjs

      - name: Validate release identity
        run: node tools/validate_release_manifest.mjs

      - name: Run deployment safety contracts
        run: node tools/test_pages_deployment.mjs

      - name: Install exact reviewed R2-07 production runtime profile
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),crypto=require('crypto'); const source='release/r2-07-forward-migration-b-runtime-config.js'; const expected='9f3170ef6dee5cf8837162a8335c8deaf3ed7b074d168ff11dd33408f22388f8'; const bytes=fs.readFileSync(source); const actual=crypto.createHash('sha256').update(bytes).digest('hex'); if(actual!==expected) throw new Error('R2-07 runtime profile hash mismatch: '+actual); fs.copyFileSync(source,'runtime-config.js');"

      - name: Build allowlisted artifact
        run: node tools/build_pages_artifact.mjs --source-sha=${{ steps.source.outputs.sha }}

      - name: Validate allowlisted artifact
        run: node tools/validate_pages_artifact.mjs

      - name: Record deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .pages-artifact-metadata/pages-deployment-manifest.json
          {
            echo "## LaxHornet Pages artifact"
            echo
            echo "- Source SHA: \`${{ steps.source.outputs.sha }}\`"
            echo "- Artifact path: \`.pages-artifact\`"
            echo "- Manifest: \`.pages-artifact-metadata/pages-deployment-manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment manifest evidence
        uses: actions/upload-artifact@v6
        with:
          name: pages-deployment-manifest-${{ steps.source.outputs.sha }}
          path: .pages-artifact-metadata/pages-deployment-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload allowlisted Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact
          retention-days: 30

  deploy:
    name: Deploy allowlisted artifact
    needs: build
    if: needs.build.outputs.deployment_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify Pages production boundary
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@v5

      - name: Check out production bundle source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.production_source_sha }}
          path: deployed-source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Rebuild reviewed production manifest without deploying
        working-directory: deployed-source
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),crypto=require('crypto'); const source='release/r2-07-forward-migration-b-runtime-config.js'; const expected='9f3170ef6dee5cf8837162a8335c8deaf3ed7b074d168ff11dd33408f22388f8'; const bytes=fs.readFileSync(source); const actual=crypto.createHash('sha256').update(bytes).digest('hex'); if(actual!==expected) throw new Error('R2-07 runtime profile hash mismatch: '+actual); fs.copyFileSync(source,'runtime-config.js');"
          node tools/build_pages_artifact.mjs --source-sha=${{ needs.build.outputs.production_source_sha }}

      - name: Verify Pages source, custom domain, HTTPS, runtime, and cache markers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/verify_pages_settings.mjs
          --expected-runtime-marker=${{ needs.build.outputs.release_marker }}
          --expected-cache-marker=${{ needs.build.outputs.cache_marker }}
          --expected-source-sha=${{ needs.build.outputs.production_source_sha }}
          --deployment-manifest=deployed-source/.pages-artifact-metadata/pages-deployment-manifest.json

      - name: Reconcile all allowlisted production files
        run: >-
          node tools/verify_pages_production.mjs
          --manifest=deployed-source/.pages-artifact-metadata/pages-deployment-manifest.json
