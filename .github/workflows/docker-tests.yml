name: LaxHornet Docker Test Suite

on:
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - '**.py'
      - 'tools/**'
      - 'supabase/**'
      - '.github/workflows/docker-tests.yml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker-based test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release-control refs
        shell: bash
        run: |
          set -euo pipefail
          database_candidate="$(jq -r '.databaseCandidate' release/laxhornet-release-manifest.json)"
          pre_cutover_runtime="$(jq -r '.preCutoverRuntime' release/laxhornet-release-manifest.json)"
          cleanup_candidate="$(jq -r '.cleanupCandidate' release/laxhornet-release-manifest.json)"
          additive_paths="supabase/migrations/20260723040000_event_pipeline_capabilities.sql,supabase/rollback/20260723040000_event_pipeline_capabilities_rollback.sql,supabase/migrations/20260727000000_tracked_playing_time_operations.sql,supabase/rollback/20260727000000_tracked_playing_time_operations_rollback.sql,supabase/tests/tracked_playing_time_foundation.sql,supabase/migrations/20260728193942_v284_public_event_semantic_boundary.sql,supabase/rollback/20260728193942_v284_public_event_semantic_boundary_rollback.sql,supabase/tests/v284_public_event_semantic_boundary.sql,supabase/migrations/20260730004700_team_members_rls_recursion.sql,supabase/rollback/20260730004700_team_members_rls_recursion_rollback.sql,supabase/tests/team_members_rls_recursion.sql,supabase/tests/team_members_rls_recursion_reproduction.sql,supabase/migrations/20260730134439_durable_game_tombstones.sql,supabase/rollback/20260730134439_durable_game_tombstones_rollback.sql,supabase/tests/durable_game_tombstones.sql,supabase/migrations/20260730151714_durable_game_tombstone_concurrency.sql,supabase/rollback/20260730151714_durable_game_tombstone_concurrency_rollback.sql,supabase/tests/durable_game_tombstone_concurrency.sql,supabase/migrations/20260806143128_r207a_dormant_concurrency_foundation.sql,supabase/rollback/20260806143128_r207a_dormant_concurrency_foundation_rollback.sql,supabase/migrations/20260809155442_r207b_controlled_preview_integration.sql,supabase/rollback/20260809155442_r207b_controlled_preview_integration_rollback.sql,supabase/seed.sql,supabase/migrations/20260809164435_r207b_qualify_preview_game_update.sql,supabase/rollback/20260809164435_r207b_qualify_preview_game_update_rollback.sql,supabase/migrations/20260809173500_r207c_versioned_event_corrections.sql,supabase/rollback/20260809173500_r207c_versioned_event_corrections_rollback.sql,supabase/migrations/20260809201608_r207d_conflict_resolution_foundation.sql,supabase/rollback/20260809201608_r207d_conflict_resolution_foundation_rollback.sql,supabase/migrations/20260811010813_r207_clock_command_batch_integration.sql,supabase/rollback/20260811010813_r207_clock_command_batch_integration_rollback.sql,supabase/migrations/20260811131042_r207_forward_migration_b_cutover_gate.sql,supabase/migrations/20260811131043_r207_forward_migration_b_activation.sql,supabase/rollback/20260811131043_r207_forward_migration_b_activation_rollback.sql"

          additive_paths="${additive_paths},supabase/migrations/20260811131044_r207_forward_migration_b_postactivation_verification.sql"

          if git merge-base --is-ancestor "$database_candidate" HEAD \
            && git merge-base --is-ancestor "$cleanup_candidate" HEAD; then
            release_base="$(git merge-base "$database_candidate" "$pre_cutover_runtime")"
            echo "LAXHORNET_AUTHORIZED_DB_REF=$database_candidate" >> "$GITHUB_ENV"
            echo "LAXHORNET_APPROVED_ADDITIVE_REF=$cleanup_candidate" >> "$GITHUB_ENV"
          else
            release_base="7cf58df9a43ce235fc6068bd4c50549e05906de4"
          fi

          echo "LAXHORNET_RELEASE_BASE_REF=$release_base" >> "$GITHUB_ENV"
          echo "LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS=$additive_paths" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: laxhornet:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run root JavaScript syntax checks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            laxhornet:test \
            sh -c 'find . -maxdepth 1 -type f -name "*.js" -print0 | sort -z | while IFS= read -r -d "" file; do echo "==> node --check $file" && node --check "$file"; done'

      - name: Run event operation service contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_event_operation_service.mjs

      - name: Run durable game and clock operation contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_durable_sync_operations.mjs

      - name: Run durable legacy game tombstone contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_game_tombstones.mjs

      - name: Run sync characterization contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_sync_characterization.mjs

      - name: Run durable legacy game tombstone migration and rollback
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          sh -c 'npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.4
          && node tools/test_game_tombstone_migration.mjs'

      - name: Run R2-07A disposable PostgreSQL concurrency matrix
        run: node tools/test_r207a_dormant_concurrency.mjs

      - name: Run R2-07C versioned event client matrix
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r207c_versioned_events.mjs

      - name: Run R2-07C client safety remediation matrix
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r207c_client_safety_remediation.mjs

      - name: Run R2-07C disposable PostgreSQL concurrency matrix
        run: node tools/test_r207c_preview_migration.mjs

      - name: Run R2-07D conflict resolution client matrix
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r207d_conflict_resolution_client.mjs

      - name: Run R2-07D disposable PostgreSQL resolution matrix
        run: node tools/test_r207d_preview_migration.mjs

      - name: Run R2-07 clock command and atomic batch client matrix
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r207_clock_command_batch_client.mjs

      - name: Run R2-07 clock command and atomic batch PostgreSQL matrix
        run: node tools/test_r207_clock_command_batch_integration.mjs

      - name: Run R2-07 Forward Migration B activation matrix
        run: node tools/test_r207_forward_migration_b_activation.mjs

      - name: Run sync error classification contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_sync_error_classification.mjs

      - name: Run tracked playing time service contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_tracked_playing_time_service.mjs

      - name: Run tracked playing time foundation contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_tracked_playing_time_foundation.mjs

      - name: Run tracked playing time UI contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_tracked_playing_time_ui.mjs

      - name: Run tracked playing time manual scenarios
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_tracked_playing_time_manual_scenarios.mjs

      - name: Run game scope capability contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_game_scope_capabilities.mjs

      - name: Run update release contract
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_update_release.mjs

      - name: Run release manifest validation
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/validate_release_manifest.mjs --require-combined --combined-ref=HEAD

      - name: Run release manifest reconciliation contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_release_manifest_reconciliation.mjs

      - name: Run historical R2-06 closeout preservation
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r206_release_closeout.mjs

      - name: Run post-R2-06 stabilization release contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_post_r206_stabilization_release.mjs

      - name: Run release hygiene checks
        run: >-
          docker run --rm
          -e LAXHORNET_RELEASE_BASE_REF
          -e LAXHORNET_AUTHORIZED_DB_REF
          -e LAXHORNET_APPROVED_ADDITIVE_REF
          -e LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          node tools/test_release_hygiene.mjs

      - name: Run R2-06 reviewed synthetic runner contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r206_synthetic_verification.mjs

      - name: Run R2-06 browser runtime and failure-envelope contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_r206_browser_runtime.mjs

      - name: Run R2-06 browser session and disposable synthetic verification
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          sh -c 'npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.4
          && node tools/test_r206_browser_session.mjs
          && node tools/test_r206_synthetic_verification_disposable.mjs'

      - name: Run phase-aware release containment
        run: >-
          docker run --rm
          -e LAXHORNET_RELEASE_BASE_REF
          -e LAXHORNET_AUTHORIZED_DB_REF
          -e LAXHORNET_APPROVED_ADDITIVE_REF
          -e LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          sh -c 'npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.4
          && node tools/test_release_containment_phase_aware.mjs'

      - name: Run minimum disclosure contracts
        run: >-
          docker run --rm
          -e LAXHORNET_RELEASE_BASE_REF
          -e LAXHORNET_AUTHORIZED_DB_REF
          -e LAXHORNET_APPROVED_ADDITIVE_REF
          -e LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          node tools/test_minimum_disclosure.mjs

      - name: Run secure disclosure activation contracts
        run: >-
          docker run --rm
          -e LAXHORNET_RELEASE_BASE_REF
          -e LAXHORNET_AUTHORIZED_DB_REF
          -e LAXHORNET_APPROVED_ADDITIVE_REF
          -e LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          node tools/test_secure_disclosure_activation.mjs

      - name: Run product alignment contracts
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_product_alignment_remediation.mjs

      - name: Run trust spine release contracts
        run: >-
          docker run --rm
          -e LAXHORNET_RELEASE_BASE_REF
          -e LAXHORNET_AUTHORIZED_DB_REF
          -e LAXHORNET_APPROVED_ADDITIVE_REF
          -e LAXHORNET_ALLOWED_ADDITIVE_DB_PATHS
          -v "${{ github.workspace }}:/app"
          laxhornet:test
          node tools/test_trust_spine_release1.mjs

      - name: Run cancel game contracts (Python)
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test python tools/test_cancel_game.py

      - name: Run delete permission contracts (Python)
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test python tools/test_delete_rpc_permissions.py

      - name: Run player-removal cleanup contracts (Python)
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test python tools/test_player_removal_request_cleanup.py

      - name: Run event pipeline secret scan
        run: docker run --rm -v "${{ github.workspace }}:/app" laxhornet:test node tools/test_event_pipeline_secret_scan.mjs

